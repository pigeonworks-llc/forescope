# Stage 6: turn a mold into its proofs. Logic Proof = each test case's verify
# command actually executed (env, exit, time). Requirement Proof = one row per
# test case ID, derived from the Logic Proof. Schema: forescope repo.
id: mold-proof
revision: 1
issued: "2026-09-28"
due: "2026-10-05"
fabless: shunichi
foundry: weak-main
parameters:
  - name: mold_file
    domain: "a mold that passes the intake check"
  - name: na
    domain: "test case IDs declared not-applicable, each with a reason"
test_cases:
  - id: TC-001
    scenario: "every verify command exits 0"
    data:
      mold_file: "a passing mold"
      na: "[]"
    expected: "every test case row is satisfied and the tool exits 0 (deliverable)"
    command: "uv run --with pytest --with pyyaml --with jsonschema pytest -q dot_local/lib/mold-lint/tests/test_executable_mold-proof.py -k all_pass"
  - id: TC-002
    scenario: "some verify command exits non-zero"
    data:
      mold_file: "a mold with a failing command"
      na: "[]"
    expected: "that row is not-satisfied, the tool exits 1 and lists it as a return reason"
    command: "uv run --with pytest --with pyyaml --with jsonschema pytest -q dot_local/lib/mold-lint/tests/test_executable_mold-proof.py -k failing"
  - id: TC-003
    scenario: "a test case is declared n/a with a reason"
    data:
      mold_file: "a mold with one n/a case"
      na: "[TC-002]"
    expected: "its command is not run and the row is not-applicable with the reason"
    command: "uv run --with pytest --with pyyaml --with jsonschema pytest -q dot_local/lib/mold-lint/tests/test_executable_mold-proof.py -k not_applicable"
  - id: TC-004
    scenario: "the mold fails the intake check"
    data:
      mold_file: "an invalid mold"
      na: "[]"
    expected: "no command is run and the tool exits 1 with the defects"
    command: "uv run --with pytest --with pyyaml --with jsonschema pytest -q dot_local/lib/mold-lint/tests/test_executable_mold-proof.py -k invalid_mold"
files:
  - dot_local/lib/mold-lint/executable_mold-proof.py
  - dot_local/lib/mold-lint/tests/test_executable_mold-proof.py
  - dot_local/lib/mold-lint/README.md
refs:
  molds: [mold-plan-pointer]
  plan7_node: 01KXWKV1MMSE3WH21WAT0GNGPP
